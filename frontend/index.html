<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel ASG · Investe Piauí</title>
    <script>
      // Mesma regra de src/tema.ts (temaInicial), aplicada antes de desenhar para não piscar.
      ;(function () {
        var s = null
        try {
          s = localStorage.getItem('asg_tema')
        } catch (e) {} // sem localStorage: segue o sistema
        var escuro = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.tema = s === 'claro' || s === 'escuro' ? s : escuro ? 'escuro' : 'claro'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
