# Roda os testes do backend e do frontend a cada PR e a cada push na main.
# Não publica nada: a publicação continua com a Vercel.
name: Testes

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: asg
          POSTGRES_PASSWORD: asg
          POSTGRES_DB: asg_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U asg -d asg_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      # Banco de teste do CI (descartado ao fim de cada execução); senhas só de teste
      TEST_DATABASE_URL: postgresql+psycopg://asg:asg@localhost:5433/asg_test
      ADMIN_EMAIL: admin@asg.local
      ADMIN_SENHA: Ci-Teste-Admin-1
      LEITOR_EMAIL: leitor@asg.local
      LEITOR_SENHA: Ci-Teste-Leitor-1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
